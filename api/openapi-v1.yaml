openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

info:
  title: Director API
  version: 0.1.0
  summary: Контролируемый API проекта «Дирижёр»
  description: |
    Статус: архитектурный черновик v1.
    Director API является единственной пользовательской точкой доступа к
    корпоративной памяти, задачам и AI-агентам. Каждый запрос проходит
    Auth/RBAC. AI получает только явно выбранные версии документов.

servers:
  - url: /api/v1
    description: Текущая установка Director API

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - name: Authentication
    description: Выпуск и отзыв короткоживущих пользовательских сессий.
  - name: Projects
    description: Проекты и их базовые метаданные.
  - name: Topics
    description: Тематическая иерархия внутри проекта.
  - name: Memory
    description: Карточки корпоративной памяти и версии документов.
  - name: Tasks
    description: Задачи, поиск контекста и хронология исполнения.
  - name: Agent Runs
    description: Запуски AI через контролируемый Agent Gateway.
  - name: Decisions
    description: Типизированные решения и их замена новыми версиями.
  - name: Audit
    description: Метаданные неизменяемого журнала действий.
  - name: Confirmations
    description: Одноразовые подтверждения замороженных операций.

paths:
  /auth/sessions:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Authentication]
      summary: Создать локальную пользовательскую сессию
      description: |
        Проверяет local identity и возвращает opaque bearer ровно один раз.
        Endpoint доступен только при явно включённом local password login.
      operationId: createUserSession
      security: []
      x-audit-events:
        - authentication.succeeded
        - authentication.failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Сессия создана; ответ запрещено кэшировать
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedUserSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oidc/start:
    get:
      tags: [Authentication]
      summary: Начать корпоративный OIDC-вход
      description: |
        Создаёт короткоживущую одноразовую server-side транзакцию и перенаправляет
        браузер на authorization endpoint провайдера. State, nonce и PKCE S256
        уникальны для каждой попытки; browser token передаётся только в
        Secure HttpOnly SameSite=Lax __Host-cookie.
      operationId: startOidcLogin
      security: []
      responses:
        '302':
          description: Перенаправление на точный authorization endpoint IdP
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oidc/callback:
    get:
      tags: [Authentication]
      summary: Завершить корпоративный OIDC-вход
      description: |
        Атомарно потребляет browser-bound транзакцию, проверяет state, nonce,
        PKCE, issuer, audience и подпись ID Token, затем сопоставляет точную
        заранее созданную identity по `(issuer, sub)` и ожидаемому provider code. Email не используется
        для автоматической привязки. Успех создаёт внутреннюю Director session в
        Secure HttpOnly __Host-cookie; bearer и токены IdP в redirect не попадают.
        Обработанный отказ authentication flow возвращает браузер на фиксированный
        same-origin UI URL с безопасным `auth_error` code; непредвиденная runtime/DB
        ошибка остаётся generic `500`.
      operationId: completeOidcLogin
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 8192
        - name: state
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: error
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: error_description
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: error_uri
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: iss
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: session_state
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      x-audit-events:
        - authentication.succeeded
      x-conditional-audit-events:
        provider_rejected: authentication.failed
        provider_unavailable: authentication.failed
        identity_not_provisioned: authentication.failed
      responses:
        '303':
          description: Фиксированное перенаправление в UI после успеха или отказа
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/sessions/current:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    delete:
      tags: [Authentication]
      summary: Отозвать текущую пользовательскую сессию
      operationId: revokeCurrentUserSession
      x-audit-events: [session.revoked]
      description: |
        При cookie-аутентификации mutation дополнительно требует точного
        same-origin `Origin`; обязательный `X-Request-Id` не является CORS-safelisted.
      responses:
        '204':
          description: Текущая сессия отозвана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oidc/logout:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Authentication]
      summary: Отозвать OIDC-сессию и подготовить logout у IdP
      operationId: revokeOidcUserSession
      x-audit-events: [session.revoked]
      description: |
        Требует текущую сессию, выпущенную настроенным OIDC provider, и точный
        same-origin `Origin` при cookie-аутентификации. Сначала атомарно отзывает
        локальную Director session, затем возвращает URL RP-initiated logout из
        проверенного discovery metadata. `logout_url` равен `null`, если IdP не
        объявил `end_session_endpoint`. UI выполняет top-level navigation только
        после успешного ответа. Raw ID Token в Director не хранится, поэтому
        `id_token_hint` не передаётся и IdP может запросить подтверждение выхода.
      responses:
        '200':
          description: Локальная сессия отозвана; URL IdP может отсутствовать
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logout_url]
                properties:
                  logout_url:
                    type: [string, 'null']
                    format: uri
                    maxLength: 4096
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags: [Projects]
      summary: Получить доступные проекты
      operationId: listProjects
      x-permissions: [project.read]
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Страница доступных проектов
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      summary: Создать проект
      operationId: createProject
      x-permissions: [project.create]
      x-audit-events: [project.created]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Проект создан вместе с default AI-policy и ролью owner
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      tags: [Projects]
      summary: Получить проект
      operationId: getProject
      x-permissions: [project.read]
      responses:
        '200':
          description: Карточка проекта
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{project_id}/topics:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      tags: [Topics]
      summary: Получить темы проекта
      operationId: listProjectTopics
      x-permissions: [project.read, topic.read]
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Страница тем проекта
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Topics]
      summary: Создать тему
      operationId: createProjectTopic
      x-permissions: [project.read, topic.create]
      x-audit-events: [topic.created]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreate'
      responses:
        '201':
          description: Тема создана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory-objects:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Memory]
      summary: Создать текстовый объект памяти без файла
      description: |
        Endpoint создает только общие типы реестра. Decision, open_question и
        ai_result создаются специализированными процессами, чтобы карточка
        памяти и типизированная запись возникали атомарно.
      operationId: createMemoryObject
      x-permissions: [project.read, memory_object.create]
      x-audit-events: [memory_object.created]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryObjectCreate'
      responses:
        '201':
          description: Объект памяти создан
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory-objects:upload:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Memory]
      summary: Загрузить документ в корпоративную память
      operationId: uploadMemoryObject
      x-permissions:
        - project.read
        - memory_object.create
        - document_version.create
      x-audit-events: [memory_object.created, document_version.created]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemoryObjectUpload'
            encoding:
              keywords:
                style: form
                explode: true
      responses:
        '201':
          description: Объект и первая версия документа созданы
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory-objects/search:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags: [Memory]
      summary: Искать по разрешенной части реестра памяти
      description: Недоступные объекты фильтруются до подсчета и пагинации.
      operationId: searchMemoryObjects
      x-permissions: [project.read, memory_object.search, memory_object.read]
      x-result-visibility-permissions:
        confidential: memory_object.read_confidential
        restricted: memory_object.read_restricted
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: q
          in: query
          required: true
          description: Поисковая строка по карточкам реестра
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MemoryObjectType'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Страница разрешенных карточек памяти
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryObjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory-objects/{memory_object_id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/MemoryObjectIdPath'
    get:
      tags: [Memory]
      summary: Получить карточку и текущую версию объекта памяти
      description: |
        Карточка доступна при `memory_object.read`. Поле `current_version`
        возвращается только при наличии `document_version.read`.
      operationId: getMemoryObject
      x-permissions: [memory_object.read]
      x-conditional-permissions:
        confidential_object: memory_object.read_confidential
        restricted_object: memory_object.read_restricted
        current_version: document_version.read
      x-audit-events: [memory_object.read]
      responses:
        '200':
          description: Объект памяти
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory-objects/{memory_object_id}/versions:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/MemoryObjectIdPath'
    post:
      tags: [Memory]
      summary: Создать новую версию документа
      operationId: createDocumentVersion
      x-permissions: [memory_object.update, document_version.create]
      x-audit-events: [document_version.created, memory_object.updated]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentVersionUpload'
      responses:
        '201':
          description: Новая версия создана и стала текущей
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Tasks]
      summary: Создать задачу пользователя
      operationId: createTask
      x-permissions: [project.read, task.create]
      x-audit-events: [task.created]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Задача создана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tasks]
      summary: Получить задачу
      operationId: getTask
      x-permissions: [task.read]
      responses:
        '200':
          description: Задача
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{task_id}/context:search:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/TaskIdPath'
    post:
      tags: [Tasks]
      summary: Подобрать карточки контекста для задачи
      description: Полный текст документов этим endpoint не возвращается.
      operationId: searchTaskContext
      x-permissions: [task.read, memory_object.search, memory_object.read]
      x-result-visibility-permissions:
        confidential: memory_object.read_confidential
        restricted: memory_object.read_restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskContextSearchRequest'
      responses:
        '200':
          description: Кандидаты контекста
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
