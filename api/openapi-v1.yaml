        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Высокоэнтропийный opaque session token; в БД хранится только SHA-256 hash.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dirizhor_session
      description: |
        Secure HttpOnly SameSite=Lax Director session. Cookie-authenticated
        mutations требуют точного HTTPS same-origin Origin.

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: true
      description: UUID логического запроса для трассировки и аудита.
      schema:
        type: string
        format: uuid
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Непрозрачный cursor, полученный в предыдущем ответе.
      schema:
        type: string
        minLength: 1
    ProjectIdPath:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectIdQuery:
      name: project_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    MemoryObjectIdPath:
      name: memory_object_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskIdPath:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunIdPath:
      name: agent_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionIdPath:
      name: decision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConfirmationIdPath:
      name: confirmation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    RequestId:
      description: UUID запроса, использованный Director API.
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Запрос не соответствует контракту.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Access token отсутствует, недействителен или сессия отозвана.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Principal известен, но действие не разрешено.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не существует или не должен раскрываться пользователю.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Операция конфликтует с текущим состоянием ресурса.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotReady:
      description: Результат запуска еще не готов или запуск завершился ошибкой.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequiresConfirmation:
      description: Permission есть, но точная операция требует confirmation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequiresConfirmationErrorResponse'
    PayloadTooLarge:
      description: Файл превышает настроенный лимит.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Превышен лимит запросов.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка без раскрытия чувствительных деталей.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Внешняя зависимость временно недоступна.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Uuid:
      type: string
      format: uuid
    NullableUuid:
      type: [string, 'null']
      format: uuid
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
    Sha256Hash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    NullableCursor:
      type: [string, 'null']

    ProjectStatus:
      type: string
      enum: [active, archived]
    MemoryObjectType:
      type: string
      enum:
        - document
        - protocol
        - decision
        - research_result
        - open_question
        - ai_result
        - note
    DirectMemoryObjectType:
      type: string
      enum: [note, protocol, research_result]
    UploadMemoryObjectType:
      type: string
      enum: [document, protocol, research_result]
    MemoryObjectStatus:
      type: string
      enum: [active, archived]
    SensitivityLevel:
      type: string
      enum: [public, internal, confidential, restricted]
    TaskStatus:
      type: string
      enum:
        - created
        - planning
        - awaiting_context
        - awaiting_user_confirmation
        - running_agent
        - reviewing
        - completed
        - failed
        - cancelled
    AgentRunStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled, awaiting_user_confirmation]
    DeploymentClass:
      type: string
      enum: [internal, external]
    DecisionStatus:
      type: string
      enum: [draft, proposed, approved, rejected, superseded]
    DecisionCreateStatus:
      type: string
      enum: [draft, proposed]
      default: draft
    ConfirmationStatus:
      type: string
      enum: [pending, approved, rejected, expired, consumed, revoked]
    ConfirmationOperation:
      type: string
      enum:
        - agent_context_share
        - bulk_context_share
        - ai_result_save
        - decision_approve
        - decision_supersede
        - sensitivity_lower
        - break_glass_project_recovery
    RelationshipEndpointType:
      type: string
      enum: [memory_object, decision, open_question, task, agent_run]
    RelationshipType:
      type: string
      enum:
        - references
        - depends_on
        - contradicts
        - supersedes
        - explains
        - implements
        - belongs_to
        - derived_from

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: [string, 'null']
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - owner_user_id
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ProjectStatus'
        owner_user_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'

    TopicCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: [string, 'null']
        parent_topic_id:
          $ref: '#/components/schemas/NullableUuid'
    Topic:
      type: object
      additionalProperties: false
      required: [id, project_id, title, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        summary:
          type: [string, 'null']
        parent_topic_id:
          $ref: '#/components/schemas/NullableUuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TopicPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'

    MemoryObjectCreate:
      type: object
      additionalProperties: false
      required: [project_id, type, title]
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/NullableUuid'
        type:
          $ref: '#/components/schemas/DirectMemoryObjectType'
        title:
          type: string
          minLength: 1
        summary:
          type: [string, 'null']
        keywords:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
        sensitivity_level:
          allOf:
            - $ref: '#/components/schemas/SensitivityLevel'
          default: internal
    MemoryObjectUpload:
      type: object
      additionalProperties: false
      required: [project_id, type, title, file]
      properties:
        project_id:
          type: string
          format: uuid
        topic_id:
          type: [string, 'null']
          format: uuid
        type:
          $ref: '#/components/schemas/UploadMemoryObjectType'
        title:
          type: string
          minLength: 1
        summary:
          type: [string, 'null']
        keywords:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
        sensitivity_level:
          allOf:
            - $ref: '#/components/schemas/SensitivityLevel'
          default: internal
        file:
          type: string
          format: binary
    DocumentVersionUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        change_summary:
          type: [string, 'null']
        file:
          type: string
          format: binary
    DocumentVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - memory_object_id
        - version_number
        - file_name
        - file_type
        - content_hash
        - size_bytes
        - created_by_user_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        memory_object_id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        file_name:
          type: string
        file_type:
          type: string
        content_hash:
          $ref: '#/components/schemas/Sha256Hash'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        created_by_user_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        change_summary:
          type: [string, 'null']
    MemoryObject:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - title
        - project_id
        - author_user_id
        - keywords
        - status
        - sensitivity_level
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/MemoryObjectType'
        title:
          type: string
        project_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/NullableUuid'
        current_version_id:
          $ref: '#/components/schemas/NullableUuid'
        current_version:
          oneOf:
            - $ref: '#/components/schemas/DocumentVersion'
            - type: 'null'
        author_user_id:
          $ref: '#/components/schemas/Uuid'
        summary:
          type: [string, 'null']
        keywords:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/MemoryObjectStatus'
        sensitivity_level:
          $ref: '#/components/schemas/SensitivityLevel'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
    MemoryObjectSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - title
        - project_id
        - keywords
        - status
        - sensitivity_level
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/MemoryObjectType'
        title:
          type: string
        project_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/NullableUuid'
        summary:
          type: [string, 'null']
        keywords:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/MemoryObjectStatus'
        sensitivity_level:
          $ref: '#/components/schemas/SensitivityLevel'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    MemoryObjectPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemoryObjectSummary'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'

    TaskCreate:
      type: object
      additionalProperties: false
      required: [project_id, title, user_request]
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 1
        user_request:
          type: string
          minLength: 1
    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - created_by_user_id
        - title
        - user_request
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        created_by_user_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        user_request:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        result_memory_object_id:
          $ref: '#/components/schemas/NullableUuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
    TaskContextSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        types:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MemoryObjectType'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    TaskContextCandidate:
      type: object
      additionalProperties: false
      required: [memory_object_id, title, reason, sensitivity_level]
      properties:
        memory_object_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        summary:
          type: [string, 'null']
        reason:
          type: string
        sensitivity_level:
          $ref: '#/components/schemas/SensitivityLevel'
    TaskContextSearchResponse:
      type: object
      additionalProperties: false
      required: [task_id, candidates]
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/TaskContextCandidate'
    TaskTimelineItem:
      type: object
      additionalProperties: false
      required: [kind, occurred_at, resource_type, resource_id, summary]
      properties:
        kind:
          type: string
          enum: [audit_event, agent_run, ai_result, decision]
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        resource_type:
          type: string
        resource_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: [string, 'null']
        summary:
          type: string
    TaskTimelinePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskTimelineItem'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'

    AgentRunContextInput:
      type: object
      additionalProperties: false
      required: [memory_object_id, document_version_id, access_reason]
      properties:
        memory_object_id:
          $ref: '#/components/schemas/Uuid'
        document_version_id:
          $ref: '#/components/schemas/Uuid'
        access_reason:
          type: string
          minLength: 1
    AgentRunCreate:
      type: object
      additionalProperties: false
      required: [agent_type, purpose, instructions, context]
      properties:
        agent_type:
          type: string
          minLength: 1
          description: Логическая роль агента, не название конкретного провайдера.
        purpose:
          type: string
          minLength: 1
        instructions:
          type: string
          minLength: 1
        context:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AgentRunContextInput'
    AgentRun:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              deployment_class:
                const: external
            required: [deployment_class]
          then:
            required: [provider_data_profile_version]
            properties:
              provider_data_profile_version:
                type: string
                minLength: 1
        - if:
            properties:
              status:
                enum: [queued, running, completed]
            required: [status]
          then:
            required:
              - context_set_hash
              - request_fingerprint
              - dispatched_at
              - deadline_at
            properties:
              context_set_hash:
                $ref: '#/components/schemas/Sha256Hash'
              request_fingerprint:
                $ref: '#/components/schemas/Sha256Hash'
              dispatched_at:
                $ref: '#/components/schemas/Timestamp'
              deadline_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                enum: [running, completed]
            required: [status]
          then:
            required: [started_at]
            properties:
              started_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                enum: [completed, failed, cancelled]
            required: [status]
          then:
            required: [finished_at]
            properties:
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error_message]
            properties:
              error_message:
                type: string
                minLength: 1
      required:
        - id
        - task_id
        - project_id
        - agent_type
        - provider
        - purpose
        - status
        - requested_by_user_id
        - deployment_class
        - origin_request_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        task_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        agent_type:
          type: string
        provider:
          type: string
        model:
          type: [string, 'null']
        purpose:
          type: string
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        requested_by_user_id:
          $ref: '#/components/schemas/Uuid'
        provider_data_profile_version:
          type: [string, 'null']
        deployment_class:
          $ref: '#/components/schemas/DeploymentClass'
        context_set_hash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hash'
            - type: 'null'
        origin_request_id:
          $ref: '#/components/schemas/Uuid'
          description: '`X-Request-Id` исходного запроса создания запуска.'
        request_fingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hash'
            - type: 'null'
          description: Хеш неизменяемого dispatch envelope Agent Gateway.
        dispatched_at:
          $ref: '#/components/schemas/NullableTimestamp'
        deadline_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        error_message:
          type: [string, 'null']
          description: Безопасное для клиента сообщение без prompt и provider payload.
    AgentRunResult:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            saved_memory_object_id:
              type: 'null'
            saved_at:
              type: 'null'
        - required: [saved_memory_object_id, saved_at]
          properties:
            saved_memory_object_id:
              $ref: '#/components/schemas/Uuid'
            saved_at:
              $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - agent_run_id
        - project_id
        - content
        - content_type
        - content_hash
        - sensitivity_level
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        agent_run_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        content:
          type: string
          description: Содержимое, прочитанное Director API из Document Store.
        content_type:
          type: string
        content_hash:
          $ref: '#/components/schemas/Sha256Hash'
        sensitivity_level:
          $ref: '#/components/schemas/SensitivityLevel'
          description: Максимальный уровень чувствительности исходного контекста.
        output_summary:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        saved_memory_object_id:
          $ref: '#/components/schemas/NullableUuid'
        saved_at:
          $ref: '#/components/schemas/NullableTimestamp'
    AgentResultSaveRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: [string, 'null']
        topic_id:
          $ref: '#/components/schemas/NullableUuid'
        keywords:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
        relationships:
          type: array
          default: []
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RelationshipRef'

    RelationshipRef:
      type: object
      additionalProperties: false
      required: [target_type, target_id, relation_type]
      properties:
        target_type:
          $ref: '#/components/schemas/RelationshipEndpointType'
        target_id:
          $ref: '#/components/schemas/Uuid'
        relation_type:
          $ref: '#/components/schemas/RelationshipType'
        description:
          type: [string, 'null']

    DecisionCreate:
      type: object
      additionalProperties: false
      required: [project_id, title, decision_text]
      properties:
        project_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/NullableUuid'
        title:
          type: string
          minLength: 1
        decision_text:
          type: string
          minLength: 1
        rationale:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/DecisionCreateStatus'
        sensitivity_level:
          allOf:
            - $ref: '#/components/schemas/SensitivityLevel'
          default: internal
        relationships:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/RelationshipRef'
    Decision:
      type: object
      additionalProperties: false
      required:
        - id
        - memory_object_id
        - project_id
        - title
        - decision_text
        - status
        - sensitivity_level
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        memory_object_id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/NullableUuid'
        title:
          type: string
        decision_text:
          type: string
        rationale:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/DecisionStatus'
        supersedes_decision_id:
          $ref: '#/components/schemas/NullableUuid'
        decided_by_user_id:
          $ref: '#/components/schemas/NullableUuid'
        decided_at:
          $ref: '#/components/schemas/NullableTimestamp'
        sensitivity_level:
          $ref: '#/components/schemas/SensitivityLevel'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    DecisionRelationship:
      type: object
      additionalProperties: false
      required:
        - id
        - source_type
        - source_id
        - target_type
        - target_id
        - relation_type
        - description
        - created_by_user_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_type:
          $ref: '#/components/schemas/RelationshipEndpointType'
        source_id:
          $ref: '#/components/schemas/Uuid'
        target_type:
          $ref: '#/components/schemas/RelationshipEndpointType'
        target_id:
          $ref: '#/components/schemas/Uuid'
        relation_type:
          $ref: '#/components/schemas/RelationshipType'
        description:
          type: [string, 'null']
        created_by_user_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    DecisionRelatedMemoryObject:
      type: object
      additionalProperties: false
      required: [id, type, title, current_version_id, sensitivity_level]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/MemoryObjectType'
        title:
          type: string
          minLength: 1
        current_version_id:
          $ref: '#/components/schemas/NullableUuid'
        sensitivity_level:
          $ref: '#/components/schemas/SensitivityLevel'
    DecisionProvenanceAgentRun:
      type: object
      additionalProperties: false
      required:
        - id
        - task_id
        - agent_type
        - provider
        - model
        - status
        - deployment_class
        - context_set_hash
        - result_memory_object_id
        - requested_by_user_id
        - origin_request_id
        - created_at
        - dispatched_at
        - started_at
        - finished_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        task_id:
          $ref: '#/components/schemas/Uuid'
        agent_type:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        model:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        deployment_class:
          $ref: '#/components/schemas/DeploymentClass'
        context_set_hash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hash'
            - type: 'null'
        result_memory_object_id:
          $ref: '#/components/schemas/NullableUuid'
        requested_by_user_id:
